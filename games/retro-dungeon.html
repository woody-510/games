<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Dungeon Crawler: Deluxe Edition</title>
    <style>
        :root {
            --bg-color: #050505;
            --ui-color: #00ff00;
            --font-family: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--ui-color);
            font-family: var(--font-family);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #ui-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            box-sizing: border-box;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 5px var(--ui-color);
            z-index: 10;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            text-align: center;
            z-index: 20;
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        h1 {
            margin-bottom: 20px;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
        }

        #start-btn {
            background-color: #000;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 15px 30px;
            font-size: 24px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            transition: all 0.2s;
            text-transform: uppercase;
        }

        #start-btn:hover {
            background-color: #0f0;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
        }
    </style>
</head>

<body>

    <div id="ui-bar">
        <span id="ui-stage">Stage: 1/10</span>
        <span id="ui-keys">Keys: 0</span>
        <span id="ui-status">Status: Locked</span>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="overlay">
            <h1>Retro Dungeon Crawler</h1>
            <button id="start-btn">START GAME</button>
        </div>
    </div>

    <script>
        /**
         * Retro Dungeon Crawler: Deluxe Edition
         * Single file implementation logic
         */

        // --- Constants & Config ---
        const TILE_SIZE = 32;
        const VIEWPORT_WIDTH = 800;
        const VIEWPORT_HEIGHT = 600;

        const COLORS = {
            WALL: '#444444',
            FLOOR: '#111111',
            PLAYER: '#FFFFFF',
            GOAL_LOCKED: '#FF0000',
            GOAL_OPEN: '#00FF00',
            KEY: '#FFD700',
            SPIKE: '#D800FF',
            LIGHT: '#FF8800',
            FOG_HIDDEN: '#000000',
            FOG_DIM: 'rgba(0, 0, 0, 0.7)'
        };

        const SYMBOLS = {
            WALL: '#',
            FLOOR: '.',
            START: 'S',
            GOAL: 'G',
            KEY: 'K',
            SPIKE: 'X',
            LIGHT: 'L'
        };

        // --- Level Data ---
        const LEVELS = [
            // Stage 1: The Beginning (S-shape)
            [
                "####################",
                "#S................X#",
                "#######.##########.#",
                "#.......#..........#",
                "#.#######.#######..#",
                "#..................G#",
                "####################"
            ],
            // Stage 2: The Key (U-shape)
            [
                "####################",
                "#S#G...............#",
                "#.#.#############..#",
                "#.#.#...........#..#",
                "#...............K..#",
                "#####..............#",
                "####################"
            ],
            // Stage 3: Watch Your Step
            [
                "####################",
                "#S.................#",
                "#.###.###.###.###X.#",
                "#.#...#...#...#...X#",
                "#.#X#.#X#.#X#.#.#..#",
                "#...#...#...#...#..G#",
                "####################"
            ],
            // Stage 4: Into the Darkness
            [
                "####################",
                "#S................X#",
                "#.#####.#####.###X.#",
                "#.#...#X#...#X#....#",
                "#.#.#.###.#.###.##.#",
                "#...#.....#.....#..G#",
                "####################"
            ],
            // Stage 5: Light in the Dark
            [
                "####################",
                "#S.................#",
                "#.#######.####.##..#",
                "#.......#.#L...#...#",
                "#######.#.####.###.#",
                "#G......#..........#",
                "####################"
            ],
            // Stage 6: The Fork
            [
                "####################",
                "#.......S..........#",
                "#.######.######.##.#",
                "#K#....#.#....#.#..#",
                "#.#.##.#.#.##.#.#..#",
                "#...#XXX...G..#....#",
                "#####....#....######",
                "####################"
            ],
            // Stage 7: Double Trouble
            [
                "#######################",
                "#S.........#..........#",
                "#.########.#.#######..#",
                "#.#K.....#.#.#.....K..#",
                "#.#.####.#.#.#.####...#",
                "#.#.#....#.#.#.#......#",
                "#...#.####...#.####.G.#",
                "#####......#.......####",
                "#######################"
            ],
            // Stage 8: The Minefield
            [
                "#######################",
                "#S..XX..X...X...X.....#",
                "#.X...XX......X...X...#",
                "#...X...XX...XX.X...X.#",
                "#.X...X...XX..XX..XX..#",
                "#X..X...X...X...X...X.#",
                "#........X......X..X.G#",
                "#######################"
            ],
            // Stage 9: Blind Faith
            [
                "#######################",
                "#S..........X.........#",
                "#.#########.###.###X#.#",
                "#.#...#...#...#...#K#.#",
                "#.###.X.###.###.###.#.#",
                "#.......X...........#G#",
                "#######################"
            ],
            // Stage 10: The Labyrinth
            [
                "########################################",
                "#S................................X....#",
                "#.......###.###.######.###.###.###.###.#",
                "#.###.#..X#.#...#....#...#.#...#...#K..#",
                "#.#...#####.###X####.###.#.###.###.###.#",
                "#.#.......#.....#....#...#.....#.......#",
                "#.#######.#####.####.#########.#######.#",
                "#.......#.#L..#....#.........#.......#.#",
                "#######.#.###.####.#########.#######.#.#",
                "#K....#.#...#.#....#X......#.#.....#...#",
                "#X###.#.###.#.####.#######.#.#.###.#####",
                "#.#...#.....#......#L......#...#.......#",
                "#.#.###.##########.#######.#####.#####.#",
                "#.#...#..........#.......#.....#.#...#.#",
                "#.###.##########.#######.#####.#.#.#.#.#",
                "#...#..........#.#XXX..#.#...#...#.#...#",
                "###.##########.#.#####.#.#.#.#####.###G#",
                "#......................#...#...........#",
                "########################################"
            ] // FIXED: Removed extra ']'
        ];

        // --- Audio System ---
        class AudioController {
            constructor() {
                this.ctx = null;
                this.initialized = false;
            }

            init() {
                try {
                    if (!this.initialized) {
                        const AudioContext = window.AudioContext || window.webkitAudioContext;
                        if (AudioContext) {
                            this.ctx = new AudioContext();
                            this.initialized = true;
                        }
                    } else if (this.ctx && this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (e) {
                    console.warn("Audio init failed:", e);
                }
            }

            playTone(freq, type, duration, startTime = 0, volume = 0.1) {
                if (!this.ctx || !this.initialized) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + startTime);

                    gain.gain.setValueAtTime(volume, this.ctx.currentTime + startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + startTime + duration);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + startTime);
                    osc.stop(this.ctx.currentTime + startTime + duration);
                } catch (e) {
                    // Ignore audio errors during play
                }
            }

            playMove() {
                this.playTone(800, 'square', 0.05, 0, 0.05);
            }

            playKey() {
                this.playTone(1200, 'sine', 0.3, 0, 0.2);
                this.playTone(1800, 'sine', 0.6, 0.1, 0.1);
            }

            playUnlock() {
                this.playTone(523.25, 'square', 0.2, 0);   // C5
                this.playTone(659.25, 'square', 0.2, 0.1); // E5
                this.playTone(783.99, 'square', 0.4, 0.2); // G5
            }

            playDie() {
                this.playTone(150, 'sawtooth', 0.4, 0, 0.3);
                this.playTone(100, 'sawtooth', 0.4, 0.1, 0.3);
            }

            playWin() {
                const now = 0;
                const note = 0.15;
                this.playTone(523.25, 'triangle', note, now);
                this.playTone(523.25, 'triangle', note, now + note);
                this.playTone(523.25, 'triangle', note, now + note * 2);
                this.playTone(659.25, 'triangle', note * 3, now + note * 3, 0.2);
            }
        }

        // --- Renderer Class ---
        class Renderer {
            constructor(canvas, game) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.game = game;
                this.camera = { x: 0, y: 0 };
            }

            updateCamera() {
                const player = this.game.player;
                if (!this.game.currentMap || !this.game.currentMap.length) return;
                
                const mapWidth = this.game.currentMap[0].length * TILE_SIZE;
                const mapHeight = this.game.currentMap.length * TILE_SIZE;

                let targetX = player.x * TILE_SIZE - VIEWPORT_WIDTH / 2 + TILE_SIZE / 2;
                let targetY = player.y * TILE_SIZE - VIEWPORT_HEIGHT / 2 + TILE_SIZE / 2;

                // マップが画面より小さいときは追従せず中央に置く
                // （従来は camera が 0 に張り付いて左上に寄っていた）
                targetX = mapWidth <= VIEWPORT_WIDTH
                    ? (mapWidth - VIEWPORT_WIDTH) / 2
                    : Math.max(0, Math.min(targetX, mapWidth - VIEWPORT_WIDTH));
                targetY = mapHeight <= VIEWPORT_HEIGHT
                    ? (mapHeight - VIEWPORT_HEIGHT) / 2
                    : Math.max(0, Math.min(targetY, mapHeight - VIEWPORT_HEIGHT));

                this.camera.x = Math.floor(targetX);
                this.camera.y = Math.floor(targetY);
            }

            draw() {
                this.ctx.fillStyle = '#000';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                if (!this.game.currentMap) return;

                const map = this.game.currentMap;
                const startCol = Math.floor(this.camera.x / TILE_SIZE);
                const endCol = startCol + (VIEWPORT_WIDTH / TILE_SIZE) + 1;
                const startRow = Math.floor(this.camera.y / TILE_SIZE);
                const endRow = startRow + (VIEWPORT_HEIGHT / TILE_SIZE) + 1;

                const offsetX = -this.camera.x;
                const offsetY = -this.camera.y;

                this.ctx.save();
                this.ctx.translate(offsetX, offsetY);

                for (let y = startRow; y <= endRow; y++) {
                    if (y < 0 || y >= map.length) continue;
                    for (let x = startCol; x <= endCol; x++) {
                        if (x < 0 || x >= map[0].length) continue;

                        const tile = map[y][x];
                        const px = x * TILE_SIZE;
                        const py = y * TILE_SIZE;

                        const dist = Math.hypot(this.game.player.x - x, this.game.player.y - y);
                        const isVisible = dist <= this.game.player.viewRadius;
                        const isVisited = this.game.visited[y][x];

                        if (!isVisible && !isVisited) continue;

                        if (tile === SYMBOLS.WALL) {
                            this.ctx.fillStyle = COLORS.WALL;
                            this.ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            this.ctx.strokeStyle = '#555';
                            this.ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
                        } else {
                            this.ctx.fillStyle = COLORS.FLOOR;
                            this.ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        }

                        if (!isVisible && isVisited) {
                            this.ctx.fillStyle = COLORS.FOG_DIM;
                            this.ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }

                const entities = this.game.entities;
                for (const ent of entities) {
                    const dist = Math.hypot(this.game.player.x - ent.x, this.game.player.y - ent.y);
                    if (dist <= this.game.player.viewRadius || this.game.visited[ent.y][ent.x]) {
                        const px = ent.x * TILE_SIZE;
                        const py = ent.y * TILE_SIZE;

                        if (ent.type === 'key') {
                            this.ctx.fillStyle = COLORS.KEY;
                            this.ctx.beginPath();
                            this.ctx.arc(px + 16, py + 16, 8, 0, Math.PI * 2);
                            this.ctx.fill();
                        } else if (ent.type === 'light') {
                            this.ctx.fillStyle = COLORS.LIGHT;
                            this.ctx.beginPath();
                            this.ctx.arc(px + 16, py + 16, 10, 0, Math.PI * 2);
                            this.ctx.fill();
                        }
                    }
                }

                const pp = this.game.player;
                this.ctx.fillStyle = COLORS.PLAYER;
                this.ctx.fillRect(pp.x * TILE_SIZE + 4, pp.y * TILE_SIZE + 4, TILE_SIZE - 8, TILE_SIZE - 8);

                for (let y = startRow; y <= endRow; y++) {
                    if (y < 0 || y >= map.length) continue;
                    for (let x = startCol; x <= endCol; x++) {
                        if (x < 0 || x >= map[0].length) continue;

                        const dist = Math.hypot(this.game.player.x - x, this.game.player.y - y);
                        const isVisible = dist <= this.game.player.viewRadius;
                        const isVisited = this.game.visited[y][x];

                        if (!isVisible && !isVisited) continue;

                        const tile = map[y][x];
                        const px = x * TILE_SIZE;
                        const py = y * TILE_SIZE;

                        if (tile === SYMBOLS.GOAL) {
                            this.ctx.fillStyle = this.game.locked ? COLORS.GOAL_LOCKED : COLORS.GOAL_OPEN;
                            this.ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
                            if (!isVisible && isVisited) {
                                this.ctx.fillStyle = COLORS.FOG_DIM;
                                this.ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            }
                        } else if (tile === SYMBOLS.SPIKE) {
                            this.ctx.fillStyle = COLORS.SPIKE;
                            this.ctx.beginPath();
                            this.ctx.moveTo(px + 16, py + 4);
                            this.ctx.lineTo(px + 28, py + 28);
                            this.ctx.lineTo(px + 4, py + 28);
                            this.ctx.fill();
                            if (!isVisible && isVisited) {
                                this.ctx.fillStyle = COLORS.FOG_DIM;
                                this.ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
                            }
                        }
                    }
                }

                this.ctx.restore();
            }
        }

        // --- Game Logic ---
        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.uiStage = document.getElementById('ui-stage');
                this.uiKeys = document.getElementById('ui-keys');
                this.uiStatus = document.getElementById('ui-status');
                this.overlay = document.getElementById('overlay');
                this.startBtn = document.getElementById('start-btn');

                this.audio = new AudioController();
                this.renderer = new Renderer(this.canvas, this);

                this.levelIndex = 0;
                this.isPlaying = false;

                this.player = { x: 1, y: 1, viewRadius: 3 };
                this.currentMap = [];
                this.visited = [];
                this.entities = [];

                this.locked = true;
                this.keysCollected = 0;
                this.keysTotal = 0;

                this.viewportWidth = VIEWPORT_WIDTH;
                this.viewportHeight = VIEWPORT_HEIGHT;

                // Start Button Listener with safety check
                if (this.startBtn) {
                    this.startBtn.addEventListener('click', () => {
                        this.audio.init();
                        this.overlay.style.display = 'none';
                        this.start();
                    });
                } else {
                    console.error("Start button not found!");
                }

                document.addEventListener('keydown', (e) => this.input(e));
            }

            start() {
                this.levelIndex = 0;
                this.loadLevel(this.levelIndex);
                this.isPlaying = true;
                this.gameLoop();
            }

            loadLevel(index) {
                if (index >= LEVELS.length) {
                    this.victory();
                    return;
                }

                const rawMap = LEVELS[index];
                if (!rawMap) {
                    console.error("Level data missing for index " + index);
                    return;
                }

                this.currentMap = [];
                this.visited = [];
                this.entities = [];
                this.keysCollected = 0;
                this.keysTotal = 0;
                this.locked = false;

                for (let y = 0; y < rawMap.length; y++) {
                    const row = rawMap[y].split('');
                    const visitedRow = [];
                    for (let x = 0; x < row.length; x++) {
                        const char = row[x];

                        if (char === SYMBOLS.START) {
                            this.player.x = x;
                            this.player.y = y;
                            row[x] = SYMBOLS.FLOOR;
                        }

                        if (char === SYMBOLS.KEY) {
                            this.entities.push({ x, y, type: 'key' });
                            this.keysTotal++;
                            row[x] = SYMBOLS.FLOOR;
                        } else if (char === SYMBOLS.LIGHT) {
                            this.entities.push({ x, y, type: 'light' });
                            row[x] = SYMBOLS.FLOOR;
                        }

                        visitedRow.push(false);
                    }
                    this.currentMap.push(row);
                    this.visited.push(visitedRow);
                }

                if (index === 3) this.player.viewRadius = 3;
                else if (index === 4) this.player.viewRadius = 2;
                else if (index === 8 || index === 9) this.player.viewRadius = 3;
                else this.player.viewRadius = 15;

                this.locked = this.keysTotal > 0;
                this.updateUI();
                this.updateVisibility();
            }

            updateVisibility() {
                const r = this.player.viewRadius;
                if (!this.currentMap.length) return;
                const width = this.currentMap[0].length;
                const height = this.currentMap.length;

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        if (Math.hypot(this.player.x - x, this.player.y - y) <= r) {
                            this.visited[y][x] = true;
                        }
                    }
                }
            }

            input(e) {
                if (!this.isPlaying) return;

                let dx = 0;
                let dy = 0;
                if (e.key === 'ArrowUp') dy = -1;
                else if (e.key === 'ArrowDown') dy = 1;
                else if (e.key === 'ArrowLeft') dx = -1;
                else if (e.key === 'ArrowRight') dx = 1;
                else return;

                e.preventDefault();
                this.tryMove(this.player.x + dx, this.player.y + dy);
            }

            tryMove(x, y) {
                if (y < 0 || y >= this.currentMap.length || x < 0 || x >= this.currentMap[0].length) return;

                const tile = this.currentMap[y][x];

                if (tile === SYMBOLS.WALL) return;

                if (tile === SYMBOLS.SPIKE) {
                    this.audio.playDie();
                    this.death();
                    return;
                }

                if (tile === SYMBOLS.GOAL) {
                    if (this.locked) {
                        return;
                    } else {
                        this.audio.playUnlock();
                        this.nextLevel();
                        return;
                    }
                }

                const entIndex = this.entities.findIndex(e => e.x === x && e.y === y);
                if (entIndex !== -1) {
                    const ent = this.entities[entIndex];
                    if (ent.type === 'key') {
                        this.audio.playKey();
                        this.keysCollected++;
                        this.entities.splice(entIndex, 1);
                        if (this.keysCollected >= this.keysTotal) {
                            this.locked = false;
                            this.audio.playUnlock();
                        }
                    } else if (ent.type === 'light') {
                        this.audio.playKey();
                        this.player.viewRadius = Math.max(this.player.viewRadius, 6);
                        this.entities.splice(entIndex, 1);
                    }
                } else {
                    this.audio.playMove();
                }

                this.player.x = x;
                this.player.y = y;
                this.updateVisibility();
                this.updateUI();
            }

            death() {
                this.loadLevel(this.levelIndex);
            }

            nextLevel() {
                this.levelIndex++;
                this.loadLevel(this.levelIndex);
            }

            victory() {
                this.isPlaying = false;
                this.audio.playWin();
                const h1 = this.overlay.querySelector('h1');
                h1.textContent = "You Escaped!";
                this.overlay.style.display = 'flex';

                const restartHandler = (e) => {
                    if (e.key === 'Enter') {
                        document.removeEventListener('keydown', restartHandler);
                        const h1 = this.overlay.querySelector('h1');
                        h1.textContent = "Retro Dungeon Crawler";
                        this.overlay.innerHTML = '<h1>Retro Dungeon Crawler</h1><button id="start-btn">START GAME</button>';
                        this.startBtn = document.getElementById('start-btn');
                        this.startBtn.addEventListener('click', () => {
                            this.audio.init();
                            this.overlay.style.display = 'none';
                            this.start();
                        });
                    }
                };
                document.addEventListener('keydown', restartHandler);
            }

            updateUI() {
                this.uiStage.textContent = `Stage: ${this.levelIndex + 1}/10`;
                this.uiKeys.textContent = `Keys: ${this.keysCollected}/${this.keysTotal}`;
                this.uiStatus.textContent = `Status: ${this.locked ? 'LOCKED' : 'OPEN'}`;
                this.uiStatus.style.color = this.locked ? 'red' : 'lime';
            }

            gameLoop() {
                if (!this.isPlaying) return;
                this.renderer.updateCamera();
                this.renderer.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // --- Init ---
        // Changed to DOMContentLoaded for safety
        document.addEventListener('DOMContentLoaded', () => {
            const game = new Game();
        });

    </script>
</body>

</html>
