<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEM MINER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Outfit:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-gold: #FFD700;
            --secondary-gold: #D4AF37;
            --accent-purple: #9D00FF;
            --deep-bg: #0F0518;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #FFFFFF;
            --text-mute: #AAAABc;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #2a0a40 0%, #05010a 100%);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* UTILITIES */
        .hidden {
            display: none !important;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-gold), var(--secondary-gold));
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: #2e1a00;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            transition: transform 0.1s, box-shadow 0.2s, filter 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transition: 0.5s;
        }

        .btn:hover::after {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.2);
        }

        /* SCREENS */
        #app {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* TITLE SCREEN */
        #title-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: radial-gradient(circle at center, #3c1255 0%, #000000 100%);
            animation: fadeIn 1s ease-out;
        }

        .scintillate {
            animation: scintillate 3s infinite alternate;
        }

        @keyframes scintillate {
            0% {
                text-shadow: 0 0 10px var(--primary-gold);
            }

            100% {
                text-shadow: 0 0 30px var(--primary-gold), 0 0 50px var(--accent-purple);
            }
        }

        .huge-title {
            font-family: 'Cinzel', serif;
            font-size: 4rem;
            color: var(--primary-gold);
            margin-bottom: 2rem;
            text-align: center;
            letter-spacing: 4px;
        }

        .hero-gem {
            font-family: 'Cinzel', serif;
            font-size: 6rem;
            margin-bottom: 3rem;
            filter: drop-shadow(0 0 20px rgba(157, 0, 255, 0.5));
            animation: float 3s ease-in-out infinite;
            cursor: pointer;
            letter-spacing: 5px;
            color: white;
            text-shadow: 0 0 20px var(--accent-purple);
        }

        /* GAME SCREEN */
        #game-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        h1.game-title {
            font-family: 'Cinzel', serif;
            color: var(--primary-gold);
            margin: 0;
            font-size: 1.5rem;
        }

        .reset-btn {
            background: transparent;
            border: 1px solid rgba(255, 100, 100, 0.5);
            color: rgba(255, 100, 100, 0.8);
            font-size: 0.8rem;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            color: #ff5555;
        }

        /* STATS PANEL */
        .stats-container {
            text-align: center;
            margin-bottom: 30px;
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .gem-count {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: #ffffff;
            text-shadow: 0 0 10px var(--accent-purple);
            margin: 0;
        }

        .currency-label {
            font-size: 1rem;
            color: var(--primary-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .gps-label {
            margin-top: 5px;
            color: var(--text-mute);
            font-size: 0.9rem;
        }

        /* MAIN CLICK AREA */
        .click-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #main-gem {
            font-family: 'Cinzel', serif;
            font-size: 6rem;
            cursor: pointer;
            transition: transform 0.05s ease-in-out;
            filter: drop-shadow(0 0 30px rgba(157, 0, 255, 0.4));
            position: relative;
            z-index: 2;
            color: white;
            text-shadow: 0 0 20px var(--accent-purple);
            letter-spacing: 5px;
        }

        #main-gem:active {
            transform: scale(0.95);
        }

        .glow-ring {
            position: absolute;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(157, 0, 255, 0.2) 0%, transparent 70%);
            animation: pulse 2s infinite;
            z-index: 1;
            pointer-events: none;
        }

        /* SHOP */
        .shop-container {
            background: var(--glass-bg);
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            padding: 15px;
            backdrop-filter: blur(10px);
            margin-top: auto;
        }

        .shop-title {
            font-family: 'Cinzel', serif;
            color: var(--secondary-gold);
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 5px;
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .upgrade-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 215, 0, 0.3);
        }

        .upgrade-info h3 {
            margin: 0;
            font-size: 1rem;
            color: white;
        }

        .upgrade-info p {
            margin: 2px 0 0;
            font-size: 0.8rem;
            color: var(--text-mute);
        }

        .buy-btn {
            background: var(--primary-gold);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            color: #2e1a00;
            cursor: pointer;
            min-width: 80px;
            transition: all 0.2s;
        }

        .buy-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            transform: none !important;
        }

        .buy-btn:not(:disabled):hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--primary-gold);
        }

        /* PARTICLES */
        .particle {
            position: absolute;
            pointer-events: none;
            font-weight: bold;
            font-size: 1.5rem;
            color: white;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 5px var(--primary-gold);
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.2);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-15px) rotate(2deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }

            100% {
                opacity: 0.5;
                transform: scale(0.8);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <!-- TITLE SCREEN -->
        <div id="title-screen">
            <h1 class="huge-title scintillate">GEM MINER</h1>
            <div class="hero-gem">GEM</div>
            <button id="start-btn" class="btn">START MINING</button>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="hidden">
            <header>
                <h1 class="game-title">GEM MINER</h1>
                <button id="reset-btn" class="reset-btn">Reset Save</button>
            </header>

            <div class="stats-container">
                <h2 id="gem-display" class="gem-count">0</h2>
                <div class="currency-label">Gems</div>
                <div id="gps-display" class="gps-label">0.0 Gems / Sec</div>
            </div>

            <div class="click-area">
                <div class="glow-ring"></div>
                <div id="main-gem">GEM</div>
            </div>

            <div class="shop-container">
                <h3 class="shop-title">Upgrades</h3>

                <!-- PICKAXE -->
                <div class="upgrade-item">
                    <div class="upgrade-info">
                        <h3>Pickaxe Efficiency</h3>
                        <p>+1 Gem per Click</p>
                        <p style="color: var(--primary-gold); font-size: 0.75rem;">Owned: <span
                                id="pickaxe-count">0</span></p>
                    </div>
                    <button id="buy-pickaxe" class="buy-btn">
                        Cost: <span id="pickaxe-cost">15</span>
                    </button>
                </div>

                <!-- AUTO DRILL -->
                <div class="upgrade-item">
                    <div class="upgrade-info">
                        <h3>Auto-Drill</h3>
                        <p>+1 Gem per Second</p>
                        <p style="color: var(--primary-gold); font-size: 0.75rem;">Owned: <span
                                id="drill-count">0</span></p>
                    </div>
                    <button id="buy-drill" class="buy-btn">
                        Cost: <span id="drill-cost">50</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* --- CONFIG & STATE --- */
        const CONFIG = {
            pickaxe: { baseCost: 15, basePower: 1, costFactor: 1.15 },
            drill: { baseCost: 50, baseGps: 1, costFactor: 1.15 }
        };

        let gameState = {
            gems: 0,
            pickaxeLevel: 0,
            drillLevel: 0
        };

        /* --- DOM ELEMENTS --- */
        const elems = {
            titleScreen: document.getElementById('title-screen'),
            gameScreen: document.getElementById('game-screen'),
            startBtn: document.getElementById('start-btn'),
            mainGem: document.getElementById('main-gem'),
            gemDisplay: document.getElementById('gem-display'),
            gpsDisplay: document.getElementById('gps-display'),
            resetBtn: document.getElementById('reset-btn'),

            pickaxeBtn: document.getElementById('buy-pickaxe'),
            drillBtn: document.getElementById('buy-drill'),
            pickaxeCost: document.getElementById('pickaxe-cost'),
            drillCost: document.getElementById('drill-cost'),
            pickaxeCount: document.getElementById('pickaxe-count'),
            drillCount: document.getElementById('drill-count'),
        };

        /* --- LOGIC --- */

        function getClickPower() {
            return 1 + gameState.pickaxeLevel;
        }

        function getGPS() {
            return gameState.drillLevel * 1;
        }

        function getCost(type) {
            if (type === 'pickaxe') {
                return Math.floor(CONFIG.pickaxe.baseCost * Math.pow(CONFIG.pickaxe.costFactor, gameState.pickaxeLevel));
            }
            if (type === 'drill') {
                return Math.floor(CONFIG.drill.baseCost * Math.pow(CONFIG.drill.costFactor, gameState.drillLevel));
            }
            return 999999;
        }

        function saveGame() {
            localStorage.setItem('gemMinerSave', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('gemMinerSave');
            if (saved) {
                try {
                    gameState = JSON.parse(saved);
                } catch (e) {
                    console.error("Save file corrupted, resetting.");
                }
            }
        }

        function resetGame() {
            if (!confirm("Are you sure you want to reset all progress?")) return;
            gameState = { gems: 0, pickaxeLevel: 0, drillLevel: 0 };
            saveGame();
            updateUI();
        }

        /* --- GAME LOOP & UPDATES --- */
        // Passive income ticks every 100ms for smoothness, adding 1/10th of per-second rate
        setInterval(() => {
            const gps = getGPS();
            if (gps > 0) {
                gameState.gems += gps / 10;
                saveGame();
                updateUI(); // Maybe optimize to not render every 100ms if performance is issue, but fine for simple game
            }
        }, 100);

        function updateUI() {
            // Stats
            elems.gemDisplay.textContent = Math.floor(gameState.gems).toLocaleString();
            elems.gpsDisplay.textContent = `${getGPS().toFixed(1)} Gems / Sec`;

            // Shop Costs & Counts
            const pCost = getCost('pickaxe');
            elems.pickaxeCost.textContent = pCost.toLocaleString();
            elems.pickaxeCount.textContent = gameState.pickaxeLevel;

            const dCost = getCost('drill');
            elems.drillCost.textContent = dCost.toLocaleString();
            elems.drillCount.textContent = gameState.drillLevel;

            // Button States
            elems.pickaxeBtn.disabled = gameState.gems < pCost;
            elems.drillBtn.disabled = gameState.gems < dCost;
        }

        /* --- INTERACTIONS --- */

        function spawnParticle(x, y, value) {
            const el = document.createElement('div');
            el.classList.add('particle');
            el.textContent = `+${value}`;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            setTimeout(() => {
                el.remove();
            }, 1000); // matches animation duration
        }

        elems.startBtn.addEventListener('click', () => {
            elems.titleScreen.classList.add('hidden');
            elems.gameScreen.classList.remove('hidden');
            loadGame();
            updateUI();
        });

        elems.mainGem.addEventListener('mousedown', (e) => {
            const power = getClickPower();
            gameState.gems += power;

            // Slightly random position around the click center for organic feel
            const x = e.clientX + (Math.random() * 20 - 10);
            const y = e.clientY - 20 + (Math.random() * 20 - 10);
            spawnParticle(x, y, power);

            updateUI();
            saveGame();
        });

        // Handle touch separately to prevent double firing or issues on mobile
        elems.mainGem.addEventListener('touchstart', (e) => {
            e.preventDefault(); // prevent mouse emulation
            const touch = e.touches[0];
            const power = getClickPower();
            gameState.gems += power;
            spawnParticle(touch.clientX, touch.clientY - 30, power);

            // Manual visual feedback since :active might not trigger well
            elems.mainGem.style.transform = "scale(0.95)";
            setTimeout(() => elems.mainGem.style.transform = "scale(1)", 100);

            updateUI();
            saveGame();
        });


        /* --- SHOP HANDLERS --- */
        elems.pickaxeBtn.addEventListener('click', () => {
            const cost = getCost('pickaxe');
            if (gameState.gems >= cost) {
                gameState.gems -= cost;
                gameState.pickaxeLevel++;
                updateUI();
                saveGame();
            }
        });

        elems.drillBtn.addEventListener('click', () => {
            const cost = getCost('drill');
            if (gameState.gems >= cost) {
                gameState.gems -= cost;
                gameState.drillLevel++;
                updateUI();
                saveGame();
            }
        });

        elems.resetBtn.addEventListener('click', resetGame);

        /* --- INITIALIZATION --- */
        // Pre-load check (optional)
        updateUI();

    </script>
</body>

</html>
