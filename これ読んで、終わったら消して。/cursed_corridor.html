<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cursed Corridor - Adjusted</title>
    <style>
        /* * スタイル定義 
         * 黒を基調としたホラーな雰囲気を設定
         */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            /* レトロで不気味なフォント */
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px #f00;
            /* 赤い光の演出 */
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        /* 走査線エフェクト（ブラウン管のようなノイズ） */
        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0),
                    rgba(255, 255, 255, 0) 50%,
                    rgba(0, 0, 0, 0.2) 50%,
                    rgba(0, 0, 0, 0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* 画面四隅を暗くするビネット効果 */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, 0.9) 100%);
            pointer-events: none;
            z-index: 11;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="scanline"></div>
        <div class="vignette"></div>
    </div>

    <script>
        /**
         * The Cursed Corridor (呪われた回廊)
         * 修正版: 障害物の間隔を調整し、回避不能な状況を低減
         */

        // --- 定数とグローバル変数 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // ゲームの状態管理
        const STATE = {
            TITLE: 0,
            PLAYING: 1,
            GAMEOVER: 2
        };
        let currentState = STATE.TITLE;

        // ゲーム設定
        const GROUND_Y = 350; // 地面のY座標
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const INITIAL_SPEED = 5;

        // 変数
        let frameCount = 0;
        let score = 0;
        let speed = INITIAL_SPEED;
        let obstacles = [];
        let particles = []; // 血しぶきやエフェクト用
        let shakeDuration = 0; // 画面揺れ用

        // プレイヤーオブジェクト
        const player = {
            x: 100,
            y: GROUND_Y,
            width: 30,
            height: 50,
            dy: 0,
            isJumping: false,
            color: '#fff'
        };

        // --- ユーティリティ関数 ---

        // ランダムな整数を取得
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // 矩形の衝突判定
        function checkCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }

        // --- ゲームループ制御 ---

        function init() {
            // イベントリスナー登録
            document.addEventListener('keydown', handleInput);
            document.addEventListener('mousedown', handleInput);
            document.addEventListener('touchstart', handleInput, { passive: false });

            // ゲームループ開始
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            player.y = GROUND_Y - player.height;
            player.dy = 0;
            player.isJumping = false;
            obstacles = [];
            particles = [];
            score = 0;
            speed = INITIAL_SPEED;
            frameCount = 0;
            shakeDuration = 0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // --- 更新処理 (Update) ---

        function update() {
            // 画面揺れの減衰
            if (shakeDuration > 0) shakeDuration--;

            if (currentState === STATE.PLAYING) {
                // スコア（生存時間）加算
                frameCount++;
                score = Math.floor(frameCount / 10);

                // 難易度上昇：時間経過でスピードアップ
                if (frameCount % 600 === 0) {
                    speed += 0.5;
                }

                // --- プレイヤーの更新 ---
                // ジャンプ物理演算
                player.dy += GRAVITY;
                player.y += player.dy;

                // 接地判定
                if (player.y > GROUND_Y - player.height) {
                    player.y = GROUND_Y - player.height;
                    player.dy = 0;
                    player.isJumping = false;
                }

                // --- 障害物の更新 ---
                // 生成ロジック修正箇所: 
                // Math.max(50, 120 - ...) に変更し、最低間隔を35→50に拡大
                // 速度による減少係数を8→6に緩和
                // これにより、理不尽な連続配置を防ぎます。
                if (frameCount % Math.max(50, 120 - Math.floor(speed * 6)) === 0) {
                    // 出現確率 (0.1のまま)
                    if (Math.random() > 0.1) {
                        spawnObstacle();
                    }
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= speed;

                    // 衝突判定
                    // プレイヤーの判定を少し小さくして遊びを持たせる
                    const hitbox = {
                        x: player.x + 5,
                        y: player.y + 5,
                        width: player.width - 10,
                        height: player.height - 10
                    };

                    if (checkCollision(hitbox, obs)) {
                        gameOver();
                    }

                    // 画面外に出たら削除
                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                // --- パーティクルの更新（背景の埃や雰囲気づくり用） ---
                if (frameCount % 10 === 0) {
                    particles.push({
                        x: canvas.width,
                        y: randomInt(0, canvas.height),
                        size: randomInt(1, 3),
                        speed: randomInt(1, 4),
                        alpha: Math.random()
                    });
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x -= p.speed * 2; // 背景は速く流して疾走感を出す
                    p.alpha -= 0.01;
                    if (p.x < 0 || p.alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }
        }

        function spawnObstacle() {
            // 障害物の種類をランダム決定 (5種類)
            const types = ['box', 'ghost', 'grave', 'hands', 'eye'];
            const type = types[randomInt(0, types.length - 1)];

            let obs = {
                x: canvas.width,
                y: 0,
                width: 0,
                height: 0,
                type: type,
                pulse: 0 // アニメーション用
            };

            // サイズと位置の設定
            switch (type) {
                case 'box': // 旧: low
                case 'grave': // 新規: 墓石
                case 'hands': // 新規: 怨念の手
                    obs.width = 40;
                    obs.height = 40;
                    if (type === 'grave') { obs.width = 35; obs.height = 45; }
                    if (type === 'hands') { obs.width = 40; obs.height = 35; }
                    obs.y = GROUND_Y - obs.height;
                    break;
                case 'ghost': // 旧: high
                case 'eye':   // 新規: 目玉
                    obs.width = 30;
                    obs.height = 50;
                    if (type === 'eye') { obs.height = 30; }
                    obs.y = GROUND_Y - 90;
                    break;
            }
            obstacles.push(obs);
        }

        function handleInput(e) {
            // スクロール防止
            if (e.type === 'touchstart') e.preventDefault();

            if (currentState === STATE.TITLE) {
                // ボタン領域のクリック判定（簡易的に画面全体のどこでもOKとするが、一応ボタン座標を意識）
                resetGame();
                currentState = STATE.PLAYING;
            } else if (currentState === STATE.PLAYING) {
                // ジャンプ
                if (!player.isJumping) {
                    player.dy = JUMP_FORCE;
                    player.isJumping = true;
                }
            } else if (currentState === STATE.GAMEOVER) {
                // RETRY or TITLE 判断
                // 簡易実装として、クリック位置で判定
                const rect = canvas.getBoundingClientRect();
                let clientX = e.clientX;
                let clientY = e.clientY;

                // タッチ対応
                if (e.type === 'touchstart' && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                const x = clientX - rect.left;
                const y = clientY - rect.top;

                // RETRYボタン周辺
                if (x > 300 && x < 500 && y > 230 && y < 270) {
                    resetGame();
                    currentState = STATE.PLAYING;
                }
                // TITLEボタン周辺
                else if (x > 300 && x < 500 && y > 290 && y < 330) {
                    currentState = STATE.TITLE;
                }
            }
        }

        function gameOver() {
            currentState = STATE.GAMEOVER;
            shakeDuration = 20; // 画面を揺らす
        }

        // --- 描画処理 (Draw) ---

        function draw() {
            // 画面クリア
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 画面揺れ適用
            ctx.save();
            if (shakeDuration > 0) {
                const dx = (Math.random() - 0.5) * 10;
                const dy = (Math.random() - 0.5) * 10;
                ctx.translate(dx, dy);
            }

            // 背景描画（遠近感のある廊下）
            drawBackground();

            if (currentState === STATE.TITLE) {
                drawTitleScreen();
            } else if (currentState === STATE.PLAYING) {
                drawGameScreen();
            } else if (currentState === STATE.GAMEOVER) {
                drawGameScreen(); // 背景としてゲーム画面を残す
                drawGameOverScreen(); // オーバーレイ
            }

            ctx.restore();
        }

        function drawBackground() {
            // 天井と床のラインを描画して奥行きを表現
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;

            // 地面ライン
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y);
            ctx.lineTo(canvas.width, GROUND_Y);
            ctx.stroke();

            // 遠近感ライン（中央消失点へ向かう線はサイドビューなので流れる線で表現）
            // 流れる埃パーティクル
            ctx.fillStyle = '#444';
            for (let p of particles) {
                ctx.globalAlpha = p.alpha;
                ctx.fillRect(p.x, p.y, p.size * 2, 2); // 横長の線にしてスピード感を出す
                ctx.globalAlpha = 1.0;
            }
        }

        function drawGameScreen() {
            // プレイヤー描画
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#fff';
            // 人型っぽく描画（頭と体）
            ctx.fillRect(player.x, player.y + 15, player.width, player.height - 15); // 体
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 10, 10, 0, Math.PI * 2); // 頭
            ctx.fill();
            ctx.shadowBlur = 0;

            // 障害物描画
            for (let obs of obstacles) {
                if (obs.type === 'box') {
                    // [BOX] 箱
                    ctx.strokeStyle = '#f00';
                    ctx.fillStyle = '#200';
                    ctx.lineWidth = 2;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
                    // バツ印
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.moveTo(obs.x + obs.width, obs.y);
                    ctx.lineTo(obs.x, obs.y + obs.height);
                    ctx.stroke();

                } else if (obs.type === 'grave') {
                    // [GRAVE] 墓石
                    ctx.fillStyle = '#333';
                    ctx.strokeStyle = '#aaa';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(obs.x, obs.y + obs.height);
                    ctx.lineTo(obs.x, obs.y + 15);
                    ctx.quadraticCurveTo(obs.x + obs.width / 2, obs.y - 5, obs.x + obs.width, obs.y + 15);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height);
                    ctx.fill();
                    ctx.stroke();
                    // 赤い十字架
                    ctx.strokeStyle = '#f00';
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.width / 2, obs.y + 10);
                    ctx.lineTo(obs.x + obs.width / 2, obs.y + 30);
                    ctx.moveTo(obs.x + obs.width / 2 - 8, obs.y + 18);
                    ctx.lineTo(obs.x + obs.width / 2 + 8, obs.y + 18);
                    ctx.stroke();

                } else if (obs.type === 'hands') {
                    // [HANDS] 怨念の手
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    for (let k = 0; k < 3; k++) {
                        let hx = obs.x + 10 + k * 10;
                        let flicker = Math.random() * 5;
                        ctx.moveTo(hx, obs.y + obs.height);
                        ctx.quadraticCurveTo(hx - 5, obs.y + obs.height / 2, hx + flicker - 2, obs.y);
                    }
                    ctx.stroke();

                } else if (obs.type === 'ghost') {
                    // [GHOST] 浮遊霊
                    obs.pulse += 0.2;
                    const wobble = Math.sin(obs.pulse) * 5;
                    ctx.fillStyle = `rgba(255, 0, 0, ${Math.abs(Math.sin(obs.pulse)) * 0.5 + 0.5})`;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + obs.width / 2, obs.y + wobble);
                    ctx.lineTo(obs.x + obs.width, obs.y + obs.height + wobble);
                    ctx.lineTo(obs.x, obs.y + obs.height + wobble);
                    ctx.fill();
                    // 目
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(obs.x + 8, obs.y + 15 + wobble, 4, 4);
                    ctx.fillRect(obs.x + 18, obs.y + 15 + wobble, 4, 4);

                } else if (obs.type === 'eye') {
                    // [EYE] 目玉
                    obs.pulse += 0.1;
                    const floatY = Math.cos(obs.pulse) * 3;
                    const centerX = obs.x + obs.width / 2;
                    const centerY = obs.y + obs.height / 2 + floatY;
                    const radius = obs.width / 2;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.fill();
                    // 充血
                    ctx.strokeStyle = '#f00';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(centerX - radius, centerY);
                    ctx.lineTo(centerX - radius + 5, centerY + 2);
                    ctx.moveTo(centerX + radius, centerY);
                    ctx.lineTo(centerX + radius - 5, centerY - 2);
                    ctx.stroke();
                    // 黒目
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius / 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    // 赤い瞳孔
                    ctx.fillStyle = '#f00';
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius / 6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // スコア表示
            ctx.fillStyle = '#fff';
            ctx.font = '20px Courier New';
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 20, 30);
        }

        function drawTitleScreen() {
            // タイトルロゴ
            ctx.textAlign = 'center';
            ctx.fillStyle = '#f00';
            ctx.font = 'bold 50px Courier New';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#f00';
            ctx.fillText("The Cursed Corridor", canvas.width / 2, 150);

            ctx.font = '20px Courier New';
            ctx.fillStyle = '#aaa';
            ctx.shadowBlur = 0;
            ctx.fillText("- ENDLESS NIGHTMARE -", canvas.width / 2, 190);

            // STARTボタン
            // 点滅効果
            const alpha = Math.abs(Math.sin(Date.now() / 500));
            ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            ctx.font = '30px Courier New';
            ctx.fillText("CLICK TO START", canvas.width / 2, 300);

            // 操作説明
            ctx.font = '16px Courier New';
            ctx.fillStyle = '#666';
            ctx.fillText("[JUMP] Click or Space", canvas.width / 2, 350);
        }

        function drawGameOverScreen() {
            // 半透明の赤オーバーレイ
            ctx.fillStyle = 'rgba(50, 0, 0, 0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.fillStyle = '#f00';
            ctx.font = 'bold 60px Courier New';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#f00';
            ctx.fillText("GAME OVER", canvas.width / 2, 150);

            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.font = '30px Courier New';
            ctx.fillText(`Final Score: ${score}`, canvas.width / 2, 200);

            // ボタン描画
            drawButton("RETRY", canvas.width / 2, 250);
            drawButton("TITLE", canvas.width / 2, 310);
        }

        function drawButton(text, x, y) {
            // ボタンの背景
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1;
            ctx.strokeRect(x - 100, y - 20, 200, 40);

            // ボタンの文字
            ctx.fillStyle = '#fff';
            ctx.font = '24px Courier New';
            ctx.fillText(text, x, y + 8);
        }

        // --- 初期化実行 ---
        window.onload = init;

    </script>
</body>

</html>
